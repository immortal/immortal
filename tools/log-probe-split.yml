---
version: 2
command:
  - target/debug/immortal-log-probe
  - --interval
  - 1s
  - --exit-after
  - 10s
  - --exit-code
  - "1"

restart:
  policy: on-failure
  limits:
    max_retries: 3

log:
  stdout:
    file: /tmp/immortal-log-probe.stdout.log
    keep: 7
    size: 1KiB
    timestamp: true
  stderr:
    file: /tmp/immortal-log-probe.stderr.log
    keep: 7
    size: 1KiB
    timestamp: true
